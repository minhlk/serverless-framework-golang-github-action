service: aws-golang-simple-http-endpoint

provider:
  name: aws
  runtime: provided.al2023
  stage: dev
  region: ap-southeast-1w
  ecr:
    images:
      latest:
        file: Dockerfile
        path: ./

functions:
  simple-function:
    description: Simple lambda function that run Go code in a containerdummy text
    image:
      name: latest
    events:
      - httpApi: "*"
